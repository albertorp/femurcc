title: "Fémur Corto Congénito"
description: "Información, experiencias y recursos sobre el Fémur Corto Congénito"
lang: es

url: "https://albertorp.github.io"
baseurl: "/femurcc"

# theme: minima
remote_theme: pages-themes/cayman@v0.2.0
show_excerpts: true

permalink: /:year/:month/:title:output_ext

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-remote-theme # add this line to the plugins list if you already have one


defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

header_pages:
  - about.md
media:
  - name: images
    input: images
    output: /images
    categories: [image]

content:
  - name: posts
    label: Entradas del blog
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{fields.title}.md"
    view:
      primary: title
      fields: [title, published]
    fields:
      - name: title
        label: Título
        type: string
        required: true
      - name: published
        label: Fecha de publicación
        type: date
        options:
          time: true
      - name: updated
        label: Última actualización
        type: date
        options:
          time: true
        required: false
      - name: author
        label: Autor
        type: string
        default: "Grupo de familias con Fémur Corto Congénito"
      - name: excerpt
        label: Extracto (resumen que aparece en la portada)
        type: text
        required: false
      - name: tags
        label: Etiquetas
        type: select
        required: false
        options:
          multiple: true
          placeholder: "Elige una o varias etiquetas"
          values:
            - "AFANIP"
            - "agenesia"
            - "alargamiento"
            - "alza"
            - "anestesia"
            - "bitutor femoral"
            - "CADENA SER"
            - "cirugía"
            - "clavo endomedular"
            - "DAFO"
            - "Doctor Downey"
            - "Doctor Ginebreda"
            - "Dr. Galbán"
            - "epifisiodesis"
            - "fisioterapia"
            - "Fitbone"
            - "Foot on Foot"
            - "Forajidos"
            - "género"
            - "hemiepifisiodesis"
            - "hemimelia peronea"
            - "Instituto Downey"
            - "Laura Montes"
            - "Luis Moraleda Novo"
            - "Naiara Biurrun"
            - "Navarra"
            - "niñas"
            - "ortopedia"
            - "PRECICE"
            - "procedimiento"
            - "prótesis"
            - "Rayos X"
            - "referentes"
            - "SEFEX"
            - "tenotomía"
            - "tibia"
            - "visibilidad"
      - name: body
        label: Contenido
        type: rich-text

  - name: about
    label: 'Página "Sobre nosotros"'
    type: file
    path: about.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: Título
        type: string
      - name: permalink
        label: Permalink
        type: string
        hidden: true
      - name: body
        label: Contenido
        type: rich-text

  - name: topics
    label: "Página \"Listado de temas\""
    type: file
    path: listado-de-temas.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: Título
        type: string
      - name: permalink
        label: Permalink
        type: string
        hidden: true
      - name: body
        label: Contenido
        type: rich-text

  - name: home
    label: Página de inicio
    type: file
    path: index.html
    format: yaml-frontmatter
    fields:
      - name: title
        label: Título
        type: string
      - name: layout
        label: Layout
        type: string
        hidden: true
      - name: body
        label: Contenido (HTML)
        type: text
        description: "Esta página usa HTML en lugar de Markdown (necesario para la paginación del blog)."

settings:
  content:
    merge: true

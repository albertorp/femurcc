{% assign locale = include.locale | default: site.locale %}
{% if site.tag_archive.path %}
  {% assign tags_sorted = page.tags | sort_natural %}

  <p class="page__taxonomy fcc-chip-row">
    <span itemprop="keywords">
    {% for tag_word in tags_sorted %}
      <a href="{{ site.tag_archive.path | relative_url }}{{ tag_word | slugify }}/" class="page__taxonomy-item fcc-tag p-category" rel="tag">#{{ tag_word }}</a>
    {% endfor %}
    </span>
  </p>
{% endif %}
